
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.application.name=api-gateway
server.port=1000

spring.cloud.gateway.routes[0].id=STUDENT-INFO
spring.cloud.gateway.routes[0].uri=lb://STUDENT-INFO
spring.cloud.gateway.routes[0].predicates[0]=Path=/student/**

spring.cloud.gateway.routes[1].id=EDUCATION-INFO
spring.cloud.gateway.routes[1].uri=lb://EDUCATION-INFO
spring.cloud.gateway.routes[1].predicates[0]=Path=/education/**

management.endpoints.web.exposure.include=*
logging.level.org.springframework.cloud.gateway=TRACE

logging.level.org.springframework.cloud.gateway.server.mvc=TRACE

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans



